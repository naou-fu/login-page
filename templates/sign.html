<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:," />
</head>
<body>
  <div>
    <h1>Register</h1>
    <!-- The sign-up page uses the same input IDs as the login page script expects. -->
    <label for="username">Username:</label>
    <input type="text" id="username" autocomplete="username" placeholder="Choose a username" />
    <label for="password">Password:</label>
    <input type="password" id="password" autocomplete="new-password" placeholder="Create a secure password" />
    <button id="btn-submit" class="btn-click">Create account</button>
    <p id="login-message"></p>
    <p><a href="/">Already have an account? Sign in</a></p>
  </div>
  <script type="module" src="sign.js"></script>
</body>
</html>
